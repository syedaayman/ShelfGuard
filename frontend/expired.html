<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShelf AI - Expired Products</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar">
        <h2>SmartShelf AI</h2>
        <ul class="sidebar-menu">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="near-expiry.html">Near Expiry</a></li>
            <li><a href="expired.html" class="active">Expired Products</a></li>
            <li><a href="donations.html">Donations</a></li>
            <li><a href="scan.html">Scan Product</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <h1>Expired Products</h1>
        </div>

        <div id="error-msg" class="error-msg"></div>

        <div class="table-container">
            <div class="table-header">
                <h2>Products That Have Expired</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Expiry Date</th>
                        <th>Time Since Expiry</th>
                        <th>Stock</th>
                        <th>Discount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expired-tbody">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/expired.js"></script>
</body>
</html>
